<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KJPP TYCOON: JURU TAKSIR 16-BIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #182026;
      font-family: 'Press Start 2P', monospace;
      color: #1c242b;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* POKEMON GBA STYLE DIALOG & HUD */
    #hud-top {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
      z-index: 5;
      flex-wrap: wrap;
    }
    .pkmn-box {
      background: #f8f8f0;
      border: 3px solid #283038;
      box-shadow:
        inset 0 0 0 3px #88a0b8,
        0 4px 0 rgba(0, 0, 0, 0.45);
      border-radius: 6px;
      padding: 8px 10px;
      pointer-events: auto;
    }
    .stat-row {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 9px;
      line-height: 1.5;
    }
    .money-txt { color: #1b7a3d; }
    .rep-txt { color: #b86b00; }
    .loc-badge {
      display: inline-block;
      background: #2b59c3;
      color: #ffffff;
      padding: 3px 6px;
      border-radius: 3px;
      font-size: 8px;
      margin-bottom: 4px;
    }
    .quest-title {
      font-size: 8px;
      color: #b81d24;
      margin-bottom: 4px;
    }
    .quest-desc {
      font-size: 8px;
      line-height: 1.5;
      color: #1c242b;
      max-width: 340px;
    }
    .top-actions {
      display: flex;
      gap: 6px;
    }
    .mini-btn {
      background: #ffdf4d;
      border: 3px solid #283038;
      border-radius: 5px;
      padding: 7px 9px;
      font-family: inherit;
      font-size: 8px;
      color: #1c242b;
      cursor: pointer;
      box-shadow: 0 3px 0 #283038;
    }
    .mini-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #283038;
    }

    /* BOTTOM DIALOG BANNER */
    #dialog-box {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: min(640px, 94vw);
      background: #f8f8f0;
      border: 4px solid #283038;
      box-shadow: inset 0 0 0 3px #d05848, 0 6px 0 rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      padding: 12px 14px;
      z-index: 8;
      display: none;
    }
    #dialog-text {
      font-size: 9px;
      line-height: 1.65;
      color: #1c242b;
    }
    #dialog-hint {
      font-size: 7px;
      color: #6b7280;
      text-align: right;
      margin-top: 6px;
    }

    /* MOBILE TOUCH CONTROLS (GBA STYLE) */
    #mobile-controls {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      pointer-events: none;
      z-index: 6;
    }
    .dpad {
      position: relative;
      width: 126px;
      height: 126px;
      pointer-events: auto;
      opacity: 0.85;
    }
    .dpad-btn {
      position: absolute;
      width: 42px;
      height: 42px;
      background: #2f3842;
      border: 3px solid #14181c;
      color: #f8f8f0;
      font-family: inherit;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      box-shadow: 0 3px 0 #14181c;
    }
    .dpad-btn:active, .dpad-btn.pressed {
      background: #526170;
      transform: translateY(2px);
    }
    #btn-up { top: 0; left: 42px; }
    #btn-down { bottom: 0; left: 42px; }
    #btn-left { top: 42px; left: 0; }
    #btn-right { top: 42px; right: 0; }

    .action-btns {
      display: flex;
      gap: 12px;
      align-items: center;
      pointer-events: auto;
      opacity: 0.88;
    }
    .ab-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid #14181c;
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      color: #ffffff;
      box-shadow: 0 4px 0 #14181c;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ab-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #14181c;
    }
    #btn-a { background: #d63031; }
    #btn-b { background: #0984e3; width: 46px; height: 46px; font-size: 9px; }

    @media (min-width: 900px) and (pointer: fine) {
      #mobile-controls { opacity: 0.45; }
      #mobile-controls:hover { opacity: 0.9; }
    }

    /* MODAL OVERLAYS (START, UPGRADE SHOP, MINIGAME) */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(16, 22, 28, 0.84);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 15;
      padding: 14px;
    }
    .overlay.hidden { display: none; }
    .modal-card {
      width: min(560px, 95vw);
      max-height: 88vh;
      overflow-y: auto;
      background: #f8f8f0;
      border: 4px solid #283038;
      box-shadow: inset 0 0 0 4px #3b82f6, 0 8px 0 #0f1419;
      border-radius: 8px;
      padding: 20px 18px;
    }
    .modal-card h2 {
      font-size: 14px;
      color: #1e3a8a;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .modal-card p {
      font-size: 8px;
      line-height: 1.7;
      color: #374151;
      margin-bottom: 14px;
    }
    .workflow-list {
      background: #eef2f6;
      border: 2px solid #94a3b8;
      padding: 10px;
      margin-bottom: 14px;
      font-size: 8px;
      line-height: 1.7;
      text-align: left;
    }
    .primary-btn {
      width: 100%;
      padding: 12px;
      background: #22c55e;
      border: 3px solid #14532d;
      color: #ffffff;
      font-family: inherit;
      font-size: 10px;
      cursor: pointer;
      box-shadow: 0 4px 0 #14532d;
      border-radius: 5px;
    }
