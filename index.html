<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HYRULE RUNNER: 16-BIT QUEST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Yuji+Syuku&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a2e1a;
      font-family: 'Press Start 2P', 'Courier New', monospace;
      color: #fff8dc;
    }
    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #ui-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }
    /* Zelda 16-Bit Wooden & Gold RPG Frame */
    .rpg-box {
      background: #2b1d14;
      border: 4px solid #f5c242;
      box-shadow:
        inset 0 0 0 3px #5c3a21,
        0 6px 0 #140c07;
      padding: 10px 14px;
    }
    .hud-label {
      font-size: 9px;
      color: #ffd966;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }
    .hud-value {
      font-size: 16px;
      color: #ffffff;
      text-shadow: 2px 2px 0 #140c07;
    }
    .hearts-bar {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

      width: 20px;
      height: 18px;
      position: relative;
      display: inline-block;
      font
